<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propostas A+</title>
<style>
:root{
  --bg:#050d09; --bg2:#08150f; --card:#0b1b14; --card2:#0f2219; --line:#1a3328; --line2:#27463a;
  --fg:#eef4f0; --mut:#a3b8ad; --dim:#6a8479;
  --lime:#b0e000; --gold:#d6b25e; --green:#6fdc8c; --blue:#5b95f9; --amber:#f2b33d; --red:#f07a6a;
  --rad:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  background:radial-gradient(900px 520px at 88% 0%,rgba(176,224,0,.06),transparent 62%),var(--bg);
}
::selection{background:var(--lime);color:#000}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);background:rgba(5,13,9,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:16px;height:64px}
header img{height:26px;width:auto}
header b{font-size:15px;font-weight:800;letter-spacing:.2px;padding-left:16px;border-left:1px solid var(--line2)}
header a.sair{margin-left:auto;font-size:13px;font-weight:700;color:var(--dim);text-decoration:none}
header a.sair:hover{color:var(--lime)}
main{padding:36px 0 80px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.eyebrow{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--lime);border-left:3px solid var(--lime);padding:1px 0 1px 11px;margin-bottom:12px}
.sub{color:var(--mut);font-size:15px;margin-top:8px}
.aviso{margin:22px 0 0;padding:12px 16px;border-radius:10px;border:1px solid rgba(242,179,61,.45);background:rgba(242,179,61,.08);color:#f6d08a;font-size:14px}

/* lista */
.cli{margin-top:34px}
.cli > h3{font-size:12.5px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:22px;display:flex;flex-direction:column;gap:14px}
.card .t{font-size:18px;font-weight:750;letter-spacing:-.2px}
.card .u{font-size:14px;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.pill{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:6px;text-transform:uppercase;background:rgba(163,184,173,.1);color:var(--mut)}
.pill.ok{background:rgba(111,220,140,.13);color:var(--green)}
.pill.at{background:rgba(242,179,61,.14);color:var(--amber)}
.pill.bl{background:rgba(91,149,249,.14);color:#9cc0ff}
.pill.cr{background:rgba(240,122,106,.14);color:var(--red)}
.valor{font-size:24px;font-weight:800;letter-spacing:-.5px}
.valor.pend{font-size:15px;color:var(--dim);font-weight:700}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:9px 14px;
  font-size:13.5px;font-weight:750;text-decoration:none;cursor:pointer;border:1px solid var(--line2);background:var(--card2);
}
.btn:hover{border-color:var(--lime);color:var(--lime)}
.btn.pri{background:var(--lime);color:#000;border-color:var(--lime)}
.btn.pri:hover{filter:brightness(1.1);color:#000}
.btn.pri:disabled{opacity:.45;cursor:default;filter:none}
.btn.del{color:var(--red);border-color:rgba(240,122,106,.35);background:none}
.btn.del:hover{background:rgba(240,122,106,.1)}
.btn.sm{padding:6px 10px;font-size:12.5px}

/* editor */
.voltar{font-size:13.5px;font-weight:700;color:var(--dim);text-decoration:none;display:inline-block;margin-bottom:18px}
.voltar:hover{color:var(--lime)}
.cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cab .dir{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.estado{font-size:13px;color:var(--dim);font-weight:650}
.estado.sujo{color:var(--amber)}
.abas{display:flex;gap:4px;margin:28px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.abas button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 16px;font-size:14.5px;font-weight:750;color:var(--dim);cursor:pointer;white-space:nowrap}
.abas button.on{color:var(--fg);border-color:var(--lime)}
.abas button .n{font-size:11px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:0 7px;margin-left:6px;color:var(--mut)}
.painel{display:none}.painel.on{display:block}

.form{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 22px}
.sec{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-top:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:7px}
.fld input,.fld select,td input,.linkform input{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:14.5px
}
.fld input:focus,.fld select:focus,td input:focus,.linkform input:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(176,224,0,.12)}
.fld.chk label{display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--fg);font-size:14.5px;margin-top:26px}
.fld.chk input{width:18px;height:18px;accent-color:var(--lime)}
select.st{padding:9px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);font-size:13.5px;font-weight:700;outline:none}

.tbl{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th{text-align:left;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);font-weight:800;padding:12px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.it b{display:block;font-weight:700}
td.it small{color:var(--dim);font-size:12px}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.num{text-align:right}
td input{padding:8px 10px;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
td.q{width:80px}td.q input{min-width:58px}td.c{width:140px}td.m{width:92px}td.p{width:150px}
td input::placeholder{color:#557064}
tr.gp td{font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);background:var(--bg2);padding:8px 12px}
tfoot td{font-weight:800;border-top:1px solid var(--line2);background:var(--bg2)}
table.ed td.it{min-width:320px;width:44%}
table.ed td.it input{text-align:left;font-variant-numeric:normal}
table.ed td.it .nm{font-weight:700;margin-bottom:6px}
table.ed td.it .sp{font-size:13px;color:var(--mut);margin-bottom:6px}
table.ed td.it .ex{display:flex;gap:6px}
table.ed td.it .ex input{font-size:12px;padding:6px 9px;color:var(--mut)}
table.ed td.it .ex input[data-t=grupo]{width:40%;flex:none;color:var(--gold)}
table.ed td{vertical-align:top}
table.ed td.num{padding-top:19px}
td.ac{white-space:nowrap;width:1%}
td.ac button{background:none;border:1px solid var(--line2);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--mut);margin-left:3px;font-size:13px}
td.ac button:hover:not(:disabled){border-color:var(--lime);color:var(--lime)}
td.ac button:disabled{opacity:.3;cursor:default}
td.ac button.rm:hover,td.ac button.conf{border-color:var(--red);color:var(--red)}
td.ac button.conf{width:auto;padding:0 8px;font-size:12px;font-weight:700}
td.vz{text-align:center;color:var(--dim);padding:26px}
.barra{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.barra .del{margin-left:auto}
.dica{font-size:13px;color:var(--dim);margin:12px 2px 0}

.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.resumo div{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px}
.resumo span{display:block;font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.resumo b{font-size:22px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.resumo .int{border-style:dashed}

.linkform{display:grid;grid-template-columns:1fr 150px 200px auto;gap:12px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px;margin-bottom:18px}
.linkform label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:7px}
.links{display:flex;flex-direction:column;gap:12px}
.lk{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.lk .r{font-weight:750}
.lk code{display:block;font-size:13px;color:var(--lime);word-break:break-all;margin-top:4px;font-family:ui-monospace,Menlo,monospace}
.lk .info{grid-column:1/-1;font-size:12.5px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.lk .bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lk .sen{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.lk .sen input{flex:1;max-width:320px;padding:9px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;outline:none}
.lk .sen input:focus{border-color:var(--lime)}
.vazio{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:var(--rad);font-size:14.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--lime);color:#000;font-weight:800;font-size:14px;padding:11px 18px;border-radius:10px;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}
@media (max-width:760px){
  .form{grid-template-columns:1fr}
  .resumo{grid-template-columns:repeat(2,1fr)}
  .linkform{grid-template-columns:1fr}
  .wrap{padding:0 16px}
  h1{font-size:27px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <img src="/pub/logo-amais.png" alt="A+.com Engenharia e Tecnologia">
  <b>Propostas</b>
  <a class="sair" href="/__sair">Sair</a>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRL=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>v===''||v==null||isNaN(Number(v))?null:Number(v);
const r2=v=>Math.round(v*100)/100;
const data=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const app=$('#app');
const CORES={'Rascunho':'','Em cotação':'at','Enviada':'bl','Aprovada':'ok','Recusada':'cr'};

function toast(msg,erro){
  const t=$('#toast');t.textContent=msg;t.className='toast on'+(erro?' err':'');
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2400);
}
async function api(q,opt={}){
  const r=await fetch('/api/admin?'+q,{...opt,headers:{'Content-Type':'application/json'},cache:'no-store'});
  if(r.status===401){location.href='/';throw new Error('sessão expirada')}
  const j=await r.json();
  if(!r.ok)throw new Error(j.erro||'erro');
  return j;
}
function aviso(p){return p?'':'<div class="aviso">Armazenamento temporário: o Redis ainda não está configurado neste ambiente, então os dados salvos se perdem quando o servidor reinicia.</div>'}

/* ---------- lista ---------- */
async function lista(){
  app.innerHTML='<p class="sub">Carregando…</p>';
  const {propostas,persistente}=await api('acao=lista');
  const porCliente={};
  propostas.forEach(p=>(porCliente[p.cliente]??=[]).push(p));
  app.innerHTML=`<span class="eyebrow">A+.com Engenharia e Tecnologia</span>
    <h1>Projetos e propostas</h1>
    <p class="sub">Abra, edite valores e gere links de acesso para o cliente.</p>${aviso(persistente)}`+
    Object.entries(porCliente).map(([c,ps])=>`<section class="cli"><h3>${esc(c)}</h3><div class="cards">${ps.map(p=>`
      <div class="card">
        <div><div class="t">${esc(p.titulo)}</div><div class="u">${esc(p.unidade)}</div></div>
        <div class="meta">
          ${p.status?`<span class="pill ${CORES[p.status]||''}">${esc(p.status)}</span>`:''}
          <span>${p.links} link${p.links===1?'':'s'} ativo${p.links===1?'':'s'}</span>
          ${p.atualizado?`<span>· salvo em ${data(p.atualizado)}</span>`:''}
        </div>
        ${p.editavel?(p.total&&p.total.completo?`<div class="valor">${BRL(p.total.valor)}</div>`:`<div class="valor pend">Valores pendentes</div>`):''}
        <div class="acoes">
          <a class="btn" href="/p/${p.slug}/" target="_blank" rel="noopener">Abrir</a>
          <a class="btn" href="/p/${p.slug}/?pdf=1" target="_blank" rel="noopener" title="Abre a proposta e a janela de salvar em PDF">PDF</a>
          ${p.editavel?`<a class="btn pri" href="#/${p.slug}">Editar valores</a>`:''}
          <a class="btn" href="#/${p.slug}/links">Links de cliente</a>
        </div>
      </div>`).join('')}</div></section>`).join('');
}

/* ---------- editor ---------- */
let E=null; // estado do editor

function calcular(){
  const m=E.modelo; if(!m)return null;
  const mp=num(E.campos.margem_padrao);
  const out={};let venda=0,custo=0,pend=0;
  for(const nome of Object.keys(m.listas)){
    let s=0,p=0,c=0;
    out[nome]=E.listas[nome].map(d=>{
      const qtd=num(d.qtd)??1, cu=num(d.custo), mg=num(d.margem)??mp;
      const sug=cu!=null&&mg!=null?r2(cu*(1+mg/100)):null, pr=num(d.preco)??sug, tot=pr!=null?r2(pr*qtd):null;
      if(tot==null)p++;else s+=tot;
      if(cu!=null)c+=cu*qtd;
      return {qtd,cu,mg,sug,pr,tot};
    });
    out[nome+'_tot']={s:r2(s),p,c:r2(c)};
    venda+=s;custo+=c;pend+=p;
  }
  out.venda=r2(venda);out.custo=r2(custo);out.pend=pend;
  return out;
}

function sujo(v=true){E.sujo=v;const e=$('#estado');if(e){e.textContent=v?'Alterações não salvas':(E.atualizado?'Salvo em '+data(E.atualizado):'Nada salvo ainda');e.className='estado'+(v?' sujo':'')}}

async function editor(slug,aba){
  app.innerHTML='<p class="sub">Carregando…</p>';
  const d=await api('acao=proposta&slug='+encodeURIComponent(slug));
  const campos={};
  (d.modelo?.campos||[]).forEach(c=>{campos[c.id]=d.calculo.campos[c.id]});
  E={slug,d,modelo:d.modelo,campos,listas:structuredClone(d.listas||{}),status:d.calculo?.status||'Rascunho',atualizado:d.salvo.atualizado,sujo:false};
  const temModelo=Boolean(d.modelo);
  aba=aba||(temModelo?'dados':'links');
  app.innerHTML=`<a class="voltar" href="#/">← Todas as propostas</a>
    <div class="cab">
      <div><span class="eyebrow">${esc(d.proposta.cliente)}</span><h1>${esc(d.proposta.titulo)}</h1><p class="sub">${esc(campos.local||d.proposta.unidade)}</p></div>
      <div class="dir">
        ${temModelo?`<span class="estado" id="estado"></span>
        <select class="st" id="status">${d.status.map(s=>`<option ${s===E.status?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}
        <a class="btn" href="/p/${slug}/" target="_blank" rel="noopener">Abrir proposta</a>
        <a class="btn" href="/p/${slug}/?pdf=1" target="_blank" rel="noopener">Baixar PDF</a>
        ${temModelo?'<button class="btn pri" id="salvar">Salvar</button>':''}
      </div>
    </div>${aviso(d.persistente)}
    <nav class="abas">
      ${temModelo?`<button data-a="dados">Dados</button><button data-a="materiais">Materiais</button><button data-a="servicos">Serviços</button><button data-a="resumo">Resumo</button>`:''}
      <button data-a="links">Links de cliente <span class="n" id="nlinks">${d.links.length}</span></button>
    </nav>
    ${temModelo?`<section class="painel" id="p-dados"></section><section class="painel" id="p-materiais"></section><section class="painel" id="p-servicos"></section><section class="painel" id="p-resumo"></section>`:''}
    <section class="painel" id="p-links"></section>`;
  app.querySelectorAll('.abas button').forEach(b=>b.onclick=()=>trocar(b.dataset.a));
  if(temModelo){
    $('#salvar').onclick=salvar;
    $('#status').onchange=e=>{E.status=e.target.value;sujo()};
    formDados();tabela('materiais');tabela('servicos');resumo();sujo(false);
  }
  painelLinks();
  trocar(aba);
}

function trocar(a){
  app.querySelectorAll('.abas button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
  app.querySelectorAll('.painel').forEach(p=>p.classList.toggle('on',p.id==='p-'+a));
  if(a==='resumo')resumo();
  history.replaceState(null,'','#/'+E.slug+(a==='dados'?'':'/'+a));
}

function formDados(){
  let html='<div class="form">',sec=null;
  for(const c of E.modelo.campos){
    if(c.secao!==sec){sec=c.secao;html+=`<div class="sec">${esc(sec)}</div>`}
    const v=E.campos[c.id];
    if(c.tipo==='booleano')html+=`<div class="fld chk"><label><input type="checkbox" data-c="${c.id}" ${v?'checked':''}> ${esc(c.rotulo)}</label></div>`;
    else html+=`<div class="fld"><label for="c-${c.id}">${esc(c.rotulo)}</label><input id="c-${c.id}" data-c="${c.id}" ${c.tipo==='numero'?'inputmode="decimal"':''} value="${esc(v)}"></div>`;
  }
  $('#p-dados').innerHTML=html+'</div><p class="dica">A margem padrão vale para todos os itens de materiais e serviços que não tiverem margem própria.</p>';
  $('#p-dados').querySelectorAll('[data-c]').forEach(el=>el.oninput=()=>{
    const c=E.modelo.campos.find(x=>x.id===el.dataset.c);
    E.campos[c.id]=c.tipo==='booleano'?el.checked:c.tipo==='numero'?el.value.replace(',','.').trim():el.value;
    sujo();
    if(el.dataset.c==='margem_padrao'){atualizarTabela('materiais');atualizarTabela('servicos')}
  });
}

const NUMS=['qtd','custo','margem','preco'];
const novoId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lerNum=v=>{const t=String(v).trim();const n=t.includes(',')?t.replace(/\./g,'').replace(',','.'):t;return t===''||isNaN(Number(n))?null:Number(n)};

function tabela(nome){
  const itens=E.listas[nome], comGrupo=nome==='materiais';
  const grupos=[...new Set(itens.map(d=>d.grupo).filter(Boolean))];
  let html=`<div class="tbl"><table class="ed"><thead><tr><th>Item</th><th class="num">Qtd</th><th class="num">Custo unit.</th><th class="num">Margem %</th><th class="num">Preço unit.</th><th class="num">Total</th><th></th></tr></thead><tbody>`;
  let g;
  itens.forEach((d,i)=>{
    if(comGrupo&&d.grupo!==g){g=d.grupo;html+=`<tr class="gp"><td colspan="7">${esc(g||'Sem grupo')}</td></tr>`}
    html+=`<tr data-i="${i}"><td class="it">
        <input class="nm" data-t="item" value="${esc(d.item)}" placeholder="Nome do item">
        <input class="sp" data-t="spec" value="${esc(d.spec)}" placeholder="Descrição que aparece para o cliente">
        <div class="ex">${comGrupo?`<input data-t="grupo" value="${esc(d.grupo)}" placeholder="Grupo" list="gl-${nome}">`:''}<input data-t="ref" value="${esc(d.ref)}" placeholder="Referência interna (fornecedor, link)"></div>
      </td>
      ${NUMS.map(f=>`<td class="${{qtd:'q',custo:'c',margem:'m',preco:'p'}[f]}"><input data-f="${f}" inputmode="decimal" value="${d[f]??''}"></td>`).join('')}
      <td class="num tot"></td>
      <td class="ac"><button title="Subir" data-a="sobe" ${i?'':'disabled'}>↑</button><button title="Descer" data-a="desce" ${i<itens.length-1?'':'disabled'}>↓</button><button title="Remover" data-a="remove" class="rm">✕</button></td></tr>`;
  });
  if(!itens.length)html+=`<tr><td colspan="7" class="vz">Nenhum item. Use “Adicionar item”.</td></tr>`;
  html+=`</tbody><tfoot><tr><td colspan="5">Total ${comGrupo?'dos materiais':'dos serviços'}</td><td class="num" id="t-${nome}"></td><td></td></tr></tfoot></table></div>
    <datalist id="gl-${nome}">${grupos.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <div class="aviso" id="av-${nome}" hidden></div>
    <div class="barra"><button class="btn" data-a="add">+ Adicionar item</button><button class="btn del" data-a="restaura">Restaurar itens do modelo</button></div>
    <p class="dica">Custo com margem (ou a margem padrão da aba Dados) gera o preço sugerido, em cinza; digitar um preço substitui o cálculo. Custo, margem e referência não aparecem para o cliente. ${comGrupo?'Itens com o mesmo grupo aparecem juntos sob o mesmo título na proposta.':''}</p>`;
  const pn=$('#p-'+nome);pn.innerHTML=html;

  pn.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
    const i=Number(tr.dataset.i),d=itens[i];
    tr.querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{
      const v=lerNum(inp.value);
      if(v==null)delete d[inp.dataset.f];else d[inp.dataset.f]=v;
      sujo();atualizarTabela(nome);
    });
    tr.querySelectorAll('input[data-t]').forEach(inp=>{
      inp.oninput=()=>{d[inp.dataset.t]=inp.value;sujo()};
      if(inp.dataset.t==='grupo')inp.onchange=()=>tabela(nome);
    });
    tr.querySelector('[data-a=sobe]').onclick=()=>{[itens[i-1],itens[i]]=[itens[i],itens[i-1]];sujo();tabela(nome)};
    tr.querySelector('[data-a=desce]').onclick=()=>{[itens[i+1],itens[i]]=[itens[i],itens[i+1]];sujo();tabela(nome)};
    const rm=tr.querySelector('[data-a=remove]');
    rm.onclick=()=>{
      if(rm.dataset.conf!=='1'){rm.dataset.conf='1';rm.textContent='Remover?';rm.classList.add('conf');setTimeout(()=>{rm.dataset.conf='';rm.textContent='✕';rm.classList.remove('conf')},3500);return}
      itens.splice(i,1);sujo();tabela(nome);
    };
  });
  pn.querySelector('[data-a=add]').onclick=()=>{
    itens.push({id:novoId(),qtd:1,...(comGrupo?{grupo:itens.length?itens[itens.length-1].grupo:''}:{})});
    sujo();tabela(nome);
    const ult=pn.querySelectorAll('tbody tr[data-i] .nm');ult[ult.length-1]?.focus();
  };
  const rs=pn.querySelector('[data-a=restaura]');
  rs.onclick=()=>{
    if(rs.dataset.conf!=='1'){rs.dataset.conf='1';rs.textContent='Confirmar: descarta os itens atuais';setTimeout(()=>{rs.dataset.conf='';rs.textContent='Restaurar itens do modelo'},4000);return}
    E.listas[nome]=structuredClone(E.modelo.listas[nome]);sujo();tabela(nome);
  };
  atualizarTabela(nome);
}

function atualizarTabela(nome){
  const c=calcular(),linhas=c[nome];
  const pn=$('#p-'+nome);if(!pn)return;
  pn.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
    const l=linhas[tr.dataset.i];
    tr.querySelector('[data-f="qtd"]').placeholder='1';
    tr.querySelector('[data-f="margem"]').placeholder=num(E.campos.margem_padrao)!=null?E.campos.margem_padrao:'—';
    tr.querySelector('[data-f="preco"]').placeholder=l.sug!=null?l.sug.toFixed(2):'—';
    tr.querySelector('.tot').textContent=BRL(l.tot);
  });
  const t=c[nome+'_tot'];
  $('#t-'+nome).textContent=BRL(t.s)+(t.p?` · ${t.p} sem preço`:'');
  const av=$('#av-'+nome);
  if(av){av.hidden=!t.p;av.textContent=`Faltam ${t.p} ${t.p===1?'item':'itens'} sem preço. Enquanto isso, o cliente não vê o slide de investimento; na sua visualização aparece o valor parcial em amarelo. Para ter preço, informe custo e margem (ou a margem padrão na aba Dados) ou digite o preço direto.`}
}

function resumo(){
  const c=calcular(),el=$('#p-resumo');if(!el)return;
  const lucro=r2(c.venda-c.custo),mg=c.custo?((c.venda/c.custo-1)*100):null;
  el.innerHTML=`<div class="resumo">
      <div><span>Materiais</span><b>${BRL(c.materiais_tot.s)}</b></div>
      <div><span>Serviços</span><b>${BRL(c.servicos_tot.s)}</b></div>
      <div><span>Total da proposta</span><b style="color:var(--lime)">${BRL(c.venda)}</b></div>
      <div><span>Itens pendentes</span><b style="color:${c.pend?'var(--amber)':'var(--green)'}">${c.pend}</b></div>
      <div class="int"><span>Custo informado</span><b>${BRL(c.custo)}</b></div>
      <div class="int"><span>Lucro bruto</span><b>${BRL(lucro)}</b></div>
      <div class="int"><span>Margem sobre custo</span><b>${mg!=null?mg.toFixed(1).replace('.',',')+'%':'—'}</b></div>
      <div class="int"><span>Preços por item</span><b style="font-size:16px">${E.campos.exibir_precos?'Visíveis ao cliente':'Ocultos'}</b></div>
    </div>
    <p class="dica">Cartões tracejados são internos. Na proposta, os totais só aparecem quando todos os itens da lista têm preço; enquanto houver pendência, ela mostra “R$ ______”. Itens sem custo no painel não entram no custo informado.</p>`;
}

async function salvar(){
  const b=$('#salvar');b.disabled=true;
  try{
    const r=await api('acao=salvar&slug='+E.slug,{method:'PUT',body:JSON.stringify({campos:E.campos,listas:E.listas,status:E.status})});
    E.atualizado=r.salvo.atualizado;sujo(false);toast('Proposta salva');
  }catch(e){toast('Erro ao salvar: '+e.message,true)}
  b.disabled=false;
}

/* ---------- links ---------- */
function painelLinks(){
  const el=$('#p-links');
  el.innerHTML=`<form class="linkform" id="lf">
      <div><label for="lr">Para quem é o link</label><input id="lr" placeholder="Ex.: Sr. David, diretoria Binatural" maxlength="120"></div>
      <div><label for="ld">Expira em (dias)</label><input id="ld" inputmode="numeric" placeholder="Sem prazo"></div>
      <div><label for="ls">Senha de acesso (opcional)</label><input id="ls" placeholder="Sem senha" maxlength="64" autocomplete="off"></div>
      <button class="btn pri" type="submit">Gerar link</button>
    </form><div class="links" id="ll"></div>
    <p class="dica">O cliente abre só esta proposta. Sem senha, basta o link; com senha, ele informa a senha antes de abrir. A senha não fica visível depois de salva: anote e envie ao cliente por outro canal. Ao excluir o link, o acesso é cortado na hora.</p>`;
  $('#lf').onsubmit=async e=>{
    e.preventDefault();
    try{
      const r=await api('acao=link&slug='+E.slug,{method:'POST',body:JSON.stringify({rotulo:$('#lr').value,dias:$('#ld').value,senha:$('#ls').value})});
      E.d.links.unshift({token:r.token,rotulo:r.rotulo,criado:r.criado,expira:r.expira,protegido:r.protegido,acessos:0,ultimoAcesso:null});
      $('#lr').value='';$('#ld').value='';$('#ls').value='';renderLinks();
      copiar(urlLink(r.token));
    }catch(err){toast('Erro: '+err.message,true)}
  };
  renderLinks();
}
const urlLink=t=>location.origin+'/s/'+t+'/';
function copiar(u){navigator.clipboard?.writeText(u).then(()=>toast('Link copiado'),()=>toast('Link gerado'))}
function renderLinks(){
  $('#nlinks').textContent=E.d.links.length;
  const el=$('#ll');
  if(!E.d.links.length){el.innerHTML='<div class="vazio">Nenhum link ativo para esta proposta.</div>';return}
  el.innerHTML=E.d.links.map(l=>{
    const venc=l.expira&&l.expira<Date.now();
    return `<div class="lk" data-t="${l.token}">
      <div><div class="r">${esc(l.rotulo)} ${venc?'<span class="pill cr">Expirado</span>':''} ${l.protegido?'<span class="pill ok">Com senha</span>':''}</div><code>${esc(urlLink(l.token))}</code></div>
      <div class="bt"><button class="btn sm" data-a="copiar">Copiar</button><a class="btn sm" href="${esc(urlLink(l.token))}" target="_blank" rel="noopener">Abrir</a><button class="btn sm" data-a="senha">${l.protegido?'Trocar senha':'Definir senha'}</button><button class="btn sm del" data-a="excluir">Excluir</button></div>
      <div class="sen" hidden><input placeholder="Nova senha (em branco remove a senha)" maxlength="64" autocomplete="off"><button class="btn sm pri" data-a="gravar">Salvar senha</button></div>
      <div class="info"><span>Criado em ${data(l.criado)}</span><span>${l.expira?'Expira em '+data(l.expira):'Sem prazo de expiração'}</span><span>${l.acessos} acesso${l.acessos===1?'':'s'}</span><span>Último acesso: ${data(l.ultimoAcesso)}</span></div>
    </div>`}).join('');
  el.querySelectorAll('.lk').forEach(div=>{
    const t=div.dataset.t;
    div.querySelector('[data-a=copiar]').onclick=()=>copiar(urlLink(t));
    const sen=div.querySelector('.sen');
    div.querySelector('[data-a=senha]').onclick=()=>{sen.hidden=!sen.hidden;if(!sen.hidden)sen.querySelector('input').focus()};
    sen.querySelector('[data-a=gravar]').onclick=async()=>{
      try{
        const r=await api('acao=link-senha&token='+encodeURIComponent(t),{method:'PUT',body:JSON.stringify({senha:sen.querySelector('input').value})});
        E.d.links.find(l=>l.token===t).protegido=r.protegido;renderLinks();toast(r.protegido?'Senha salva':'Senha removida');
      }catch(err){toast('Erro: '+err.message,true)}
    };
    const del=div.querySelector('[data-a=excluir]');
    del.onclick=async()=>{
      if(del.dataset.conf!=='1'){del.dataset.conf='1';del.textContent='Confirmar exclusão';setTimeout(()=>{del.dataset.conf='';del.textContent='Excluir'},4000);return}
      try{await api('acao=link&token='+encodeURIComponent(t),{method:'DELETE'});E.d.links=E.d.links.filter(l=>l.token!==t);renderLinks();toast('Link excluído')}
      catch(err){toast('Erro: '+err.message,true)}
    };
  });
}

/* ---------- rotas ---------- */
function rota(){
  if(E?.sujo&&!confirmarSaida())return;
  const [slug,aba]=location.hash.replace(/^#\/?/,'').split('/');
  E=null;
  (slug?editor(slug,aba):lista()).catch(e=>{app.innerHTML=`<div class="aviso">Erro: ${esc(e.message)}</div>`});
}
function confirmarSaida(){return window.confirm('Há alterações não salvas. Sair mesmo assim?')}
addEventListener('hashchange',rota);
addEventListener('beforeunload',e=>{if(E?.sujo){e.preventDefault();e.returnValue=''}});
rota();
</script>
</body>
</html>
